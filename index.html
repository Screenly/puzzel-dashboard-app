<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzzel Dashboard App - Screenly Edge App</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body>
    <auto-scaler
      reference-width="1920"
      reference-height="1080"
      orientation="auto"
    >
      <div
        id="app"
        class="flex h-full w-full flex-col gap-8 bg-neutral-900 px-12 py-7 text-white portrait:px-8 portrait:py-7"
      >
        <app-header class="bg-neutral-800 [zoom:1.4]" show-date></app-header>
        <main
          id="dashboard"
          class="flex flex-1 flex-col gap-8 overflow-hidden"
          style="display: none"
        >
          <section
            id="queue-cards"
            class="grid min-h-0 flex-[3] auto-rows-fr grid-cols-3 gap-8 overflow-hidden portrait:grid-cols-1 [&>:nth-child(n+3)]:portrait:hidden"
          ></section>
          <section
            id="agent-tiles"
            class="grid min-h-0 flex-1 auto-rows-fr grid-cols-6 gap-8 overflow-hidden portrait:flex-[0.6] portrait:grid-cols-2 [&>:nth-child(n+5)]:portrait:hidden"
          ></section>
        </main>
      </div>
    </auto-scaler>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
